name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt

      - name: Install ruff
        run: pip install -r requirements-dev.txt

      - name: Ruff
        run: ruff check --output-format=github .

  test:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements*.txt

      - name: Install dependencies
        run: pip install -r requirements.txt -r requirements-dev.txt

      - name: Run tests
        run: pytest --cov --cov-report=term-missing --cov-report=xml --junitxml=junit.xml

      - name: Upload test and coverage reports
        if: always() && matrix.python-version == '3.12'
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            junit.xml
            coverage.xml
          if-no-files-found: ignore

  docker:
    name: Docker build and smoke test
    runs-on: ubuntu-latest
    env:
      IMAGE: discordata:ci
      SECRET: ci-webhook-secret
      BASE_URL: https://localhost:1276
    steps:
      - uses: actions/checkout@v5

      - uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: ${{ env.IMAGE }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Create a self-signed certificate
        run: |
          mkdir -p "$RUNNER_TEMP/certs"
          openssl req -x509 -newkey rsa:2048 -nodes -days 1 -subj "/CN=localhost" \
            -keyout "$RUNNER_TEMP/certs/key.pem" -out "$RUNNER_TEMP/certs/cert.pem"
          chmod 644 "$RUNNER_TEMP/certs/"*.pem

      - name: Start container
        run: |
          docker run -d --name discordata -p 1276:1276 \
            -v "$RUNNER_TEMP/certs:/certs:ro" \
            -e WEBHOOK_SECRET="$SECRET" \
            -e DISCORD_WEBHOOK_URL=https://discord.invalid/api/webhooks/ci \
            "$IMAGE"
          for i in $(seq 1 30); do
            if curl -sk -o /dev/null "$BASE_URL/webhook"; then
              echo "Gunicorn is up after ${i}s"
              exit 0
            fi
            sleep 1
          done
          echo "Gunicorn did not start in 30s"
          exit 1

      - name: Smoke test
        run: |
          set -euo pipefail

          # A signed event of a type Discordata skips: proves signature checking
          # works without calling Sumsub or Discord.
          body='{"applicantId":"ci-applicant","type":"applicantCreated"}'
          sig=$(printf '%s' "$body" | openssl dgst -sha256 -hmac "$SECRET" | awk '{print $NF}')

          status=$(curl -sk -o /dev/null -w '%{http_code}' -X POST "$BASE_URL/webhook" \
            -H 'Content-Type: application/json' -H "x-payload-digest: $sig" --data "$body")
          echo "Signed request: $status"
          test "$status" = 200

          status=$(curl -sk -o /dev/null -w '%{http_code}' -X POST "$BASE_URL/webhook" \
            -H 'Content-Type: application/json' -H 'x-payload-digest: bad' --data "$body")
          echo "Badly signed request: $status"
          test "$status" = 400

          headers=$(curl -sk -D - -o /dev/null -X POST "$BASE_URL/webhook" \
            -H 'Content-Type: application/json' -H "x-payload-digest: $sig" --data "$body")
          echo "$headers"
          echo "$headers" | grep -qi '^strict-transport-security:'
          echo "$headers" | grep -qi '^content-security-policy:'
          echo "$headers" | grep -qi '^server: gunicorn'

      - name: Container logs
        if: always()
        run: docker logs discordata || true

      - name: Stop container
        if: always()
        run: docker rm -f discordata || true
